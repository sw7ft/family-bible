name: FamilyBible
options:
  bundleIdPrefix: com.sw7ft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  DEVELOPMENT_TEAM: RB6YQW2B5J
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
targets:
  FamilyBible:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FamilyBible
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sw7ft.quietbible
        PRODUCT_NAME: Family Bible
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "55"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FamilyBible/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Family Bible
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 SW7FT"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Family Bible uses the camera when you attach a picture to a note, comment, devotion, or prayer.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies: []
